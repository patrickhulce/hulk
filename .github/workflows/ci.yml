name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: yarn
      - run: yarn test
      - run: ./bin/hulk.js npm-publish --yes
        if: github.event_name != 'pull_request'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
